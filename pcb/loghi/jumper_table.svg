<svg xmlns="http://www.w3.org/2000/svg" width="24mm" height="16mm" viewBox="0 0 24 16">
  <!-- Tabella configurazione jumper per serigrafia (import su F/B.Silkscreen).
       Verificata dai collegamenti reali della board.
       O = aperto, C = chiuso ; 1-2 / 2-3 = pad da ponticellare.
       NB: se KiCad non importa il testo dell'SVG, i valori sono nel messaggio
       di chat e si possono aggiungere come testo nativo KiCad. -->

  <!-- griglia -->
  <g fill="none" stroke="#000000" stroke-width="0.15">
    <rect x="0.2" y="2.4" width="22.6" height="11.2"/>
    <line x1="8.4" y1="2.4"  x2="8.4"  y2="13.6"/>
    <line x1="0.2" y1="4.4"  x2="22.8" y2="4.4"/>
    <line x1="13.1" y1="2.4" x2="13.1" y2="13.6"/>
    <line x1="17.5" y1="2.4" x2="17.5" y2="13.6"/>
  </g>

  <g fill="#000000" font-family="monospace" font-size="1.3">
    <!-- titolo -->
    <text x="0.3" y="1.75" font-size="1.7" font-weight="bold">JUMPER SETUP</text>

    <!-- intestazione colonne -->
    <text x="10.75" y="3.9" text-anchor="middle" font-weight="bold">LFP</text>
    <text x="15.30" y="3.9" text-anchor="middle" font-weight="bold">LiPo</text>
    <text x="20.15" y="3.9" text-anchor="middle" font-weight="bold">AA</text>

    <!-- etichette righe -->
    <text x="0.5" y="5.9">JP1 IN</text>
    <text x="0.5" y="7.7">JP2 OUT</text>
    <text x="0.5" y="9.5">JP3 V</text>
    <text x="0.5" y="11.3">JP4 CHG</text>
    <text x="0.5" y="13.1">JP5 Imeas</text>

    <!-- dati: colonna LFP -->
    <text x="10.75" y="5.9"  text-anchor="middle">1-2</text>
    <text x="10.75" y="7.7"  text-anchor="middle">1-2</text>
    <text x="10.75" y="9.5"  text-anchor="middle">O</text>
    <text x="10.75" y="11.3" text-anchor="middle">C</text>
    <text x="10.75" y="13.1" text-anchor="middle">C</text>

    <!-- dati: colonna LiPo -->
    <text x="15.30" y="5.9"  text-anchor="middle">2-3</text>
    <text x="15.30" y="7.7"  text-anchor="middle">2-3</text>
    <text x="15.30" y="9.5"  text-anchor="middle">C</text>
    <text x="15.30" y="11.3" text-anchor="middle">C</text>
    <text x="15.30" y="13.1" text-anchor="middle">C</text>

    <!-- dati: colonna AA -->
    <text x="20.15" y="5.9"  text-anchor="middle">2-3</text>
    <text x="20.15" y="7.7"  text-anchor="middle">2-3</text>
    <text x="20.15" y="9.5"  text-anchor="middle">-</text>
    <text x="20.15" y="11.3" text-anchor="middle">O</text>
    <text x="20.15" y="13.1" text-anchor="middle">C</text>

    <!-- legenda -->
    <text x="0.3" y="15.4" font-size="1.05">O=open  C=close   never diode(1-2) w/ LiPo/AA</text>
  </g>
</svg>
